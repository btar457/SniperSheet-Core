# SniperSheet — Azure App Service Deployment
# esbuild bundles everything into dist/index.mjs — no node_modules needed on Azure

name: Build and deploy Node.js app to Azure Web App - SniperSheet-Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SniperSheet for Azure
        run: node scripts/build-azure.mjs
        env:
          NODE_ENV: production
          BASE_PATH: /
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      - name: Prepare deployment package
        run: |
          mkdir deploy
          # esbuild bundles all code — only dist/ is needed
          cp -r artifacts/api-server/dist deploy/dist
          # Minimal package.json with start script for Azure
          echo '{"name":"snipersheet","version":"1.0.0","type":"module","scripts":{"start":"node dist/index.mjs"}}' > deploy/package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54B6B3BD0FB24860A3DB5C502EAD94F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_753E4EAD3B9840138B12D6C794F479AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FCF84435F434490DA3A2E2A8B20D244F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SniperSheet-Core'
          slot-name: 'Production'
          package: .
          startup-command: 'node dist/index.mjs'