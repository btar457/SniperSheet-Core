# SniperSheet — Azure App Service Deployment
# Auto-corrected to use pnpm monorepo build

name: Build and deploy Node.js app to Azure Web App - SniperSheet-Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project for Azure
        run: node scripts/build-azure.mjs
        env:
          NODE_ENV: production
          BASE_PATH: /
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      - name: Package deployment artifact
        run: |
          mkdir -p deploy-pkg
          cp -r artifacts/api-server/dist deploy-pkg/dist
          cp artifacts/api-server/package.json deploy-pkg/package.json
          # Startup helper
          cat > deploy-pkg/startup.sh << 'SH'
          #!/bin/bash
          cd /home/site/wwwroot
          node dist/index.mjs
          SH
          chmod +x deploy-pkg/startup.sh
          cd deploy-pkg && npm install --omit=dev --legacy-peer-deps

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54B6B3BD0FB24860A3DB5C502EAD94F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_753E4EAD3B9840138B12D6C794F479AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FCF84435F434490DA3A2E2A8B20D244F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SniperSheet-Core'
          slot-name: 'Production'
          package: .
          startup-command: 'node dist/index.mjs'
