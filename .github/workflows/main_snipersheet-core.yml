name: Build and deploy Node.js app to Azure Web App - SniperSheet-Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SniperSheet for Azure
        run: node scripts/build-azure.mjs
        env:
          NODE_ENV: production
          BASE_PATH: /
          PORT: "8080"
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp -r artifacts/api-server/dist deploy/dist
          echo '{"name":"snipersheet","version":"1.0.0","type":"module","scripts":{"start":"node dist/index.mjs"}}' > deploy/package.json
          cd deploy && zip -r ../app.zip . && cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54B6B3BD0FB24860A3DB5C502EAD94F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_753E4EAD3B9840138B12D6C794F479AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FCF84435F434490DA3A2E2A8B20D244F }}

      - name: Configure Azure App Settings
        run: |
          az webapp config appsettings set \
            --name SniperSheet-Core \
            --resource-group SniperSheet_Group \
            --settings \
              NODE_ENV=production \
              SNIPER_APP_TOKEN=${{ secrets.VITE_APP_TOKEN }} \
              GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION="~20"

      - name: Set startup command
        run: |
          az webapp config set \
            --name SniperSheet-Core \
            --resource-group SniperSheet_Group \
            --startup-file "node dist/index.mjs"

      - name: Start web app before deploy
        run: |
          az webapp start \
            --name SniperSheet-Core \
            --resource-group SniperSheet_Group
          sleep 10

      - name: Deploy via Azure CLI
        run: |
          az webapp deploy \
            --name SniperSheet-Core \
            --resource-group SniperSheet_Group \
            --src-path app.zip \
            --type zip \
            --async false

      - name: Restart web app
        run: |
          az webapp restart \
            --name SniperSheet-Core \
            --resource-group SniperSheet_Group