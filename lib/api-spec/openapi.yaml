openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Excel Add-in API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: commands
    description: Excel command operations
  - name: cells
    description: Cell dimension operations
  - name: smart
    description: AI-powered smart logic engine
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /commands/execute:
    post:
      operationId: executeCommand
      tags: [commands]
      summary: Execute a spreadsheet command
      description: Interprets and executes commands like Sum, Multiply, Average, Min, Max on provided values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCommandBody"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          description: Invalid command or values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /commands/history:
    get:
      operationId: getCommandHistory
      tags: [commands]
      summary: Get command history
      description: Returns the last 20 executed commands with their results
      responses:
        "200":
          description: Command history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandHistoryItem"

  /cells/dimensions:
    post:
      operationId: calculateCellDimensions
      tags: [cells]
      summary: Calculate cell dimensions
      description: Calculates the optimal width and height for a cell based on text content and font settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellDimensionRequest"
      responses:
        "200":
          description: Calculated dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellDimensions"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /smart/analyze:
    post:
      operationId: smartAnalyze
      tags: [smart]
      summary: AI-powered formula and logic generation
      description: Parses a natural language description (Arabic or English) and generates an Excel formula, result, reasoning, and style hints using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartAnalyzeBody"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartAnalyzeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /smart/history:
    get:
      operationId: getSmartHistory
      tags: [smart]
      summary: Get smart command history
      description: Returns the last 20 smart AI commands
      responses:
        "200":
          description: Smart history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartHistoryItem"

  /cells/batch-dimensions:
    post:
      operationId: calculateBatchCellDimensions
      tags: [cells]
      summary: Calculate dimensions for multiple cells
      description: Calculates optimal dimensions for a batch of cells based on their text content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCellDimensionRequest"
      responses:
        "200":
          description: Batch dimension results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCellDimensions"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ExecuteCommandBody:
      type: object
      properties:
        command:
          type: string
          description: The command to execute (e.g., "Sum", "Multiply", "Average", "Min", "Max", "Subtract", "Divide")
        values:
          type: array
          items:
            type: number
          description: The numeric values to operate on
        cellRange:
          type: ["string", "null"]
          description: Optional cell range reference (e.g., "A1:C3")
      required:
        - command
        - values

    CommandResult:
      type: object
      properties:
        command:
          type: string
        result:
          type: number
        formula:
          type: string
          description: The formula string representation
        description:
          type: string
      required:
        - command
        - result
        - formula
        - description

    CommandHistoryItem:
      type: object
      properties:
        id:
          type: integer
        command:
          type: string
        values:
          type: array
          items:
            type: number
        result:
          type: number
        formula:
          type: string
        cellRange:
          type: ["string", "null"]
        executedAt:
          type: string
          format: date-time
      required:
        - id
        - command
        - values
        - result
        - formula
        - cellRange
        - executedAt

    CellDimensionRequest:
      type: object
      properties:
        text:
          type: string
          description: The text content of the cell
        fontSize:
          type: ["integer", "null"]
          description: Font size in points (default 11)
        bold:
          type: ["boolean", "null"]
          description: Whether the text is bold
        padding:
          type: ["integer", "null"]
          description: Cell padding in pixels (default 8)
        maxWidth:
          type: ["integer", "null"]
          description: Maximum cell width in pixels
        wrapText:
          type: ["boolean", "null"]
          description: Whether to wrap text (affects height calculation)
      required:
        - text

    CellDimensions:
      type: object
      properties:
        width:
          type: integer
          description: Calculated cell width in pixels
        height:
          type: integer
          description: Calculated cell height in pixels
        widthExcel:
          type: number
          description: Width in Excel column units
        heightExcel:
          type: number
          description: Height in Excel row units (points)
        characterCount:
          type: integer
        lineCount:
          type: integer
      required:
        - width
        - height
        - widthExcel
        - heightExcel
        - characterCount
        - lineCount

    BatchCellDimensionRequest:
      type: object
      properties:
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellDimensionRequest"
        uniformWidth:
          type: ["boolean", "null"]
          description: If true, returns the max width for all cells
        uniformHeight:
          type: ["boolean", "null"]
          description: If true, returns the max height for all cells
      required:
        - cells

    BatchCellDimensions:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CellDimensions"
        maxWidth:
          type: integer
        maxHeight:
          type: integer
        recommendedWidth:
          type: integer
        recommendedHeight:
          type: integer
      required:
        - results
        - maxWidth
        - maxHeight
        - recommendedWidth
        - recommendedHeight

    SmartAnalyzeBody:
      type: object
      properties:
        description:
          type: string
          description: Natural language description of the desired Excel logic (Arabic or English)
        values:
          type: array
          items:
            type: number
          description: Optional numeric values to use in calculations
        cellRef:
          type: ["string", "null"]
          description: Optional cell reference context (e.g., "A1", "B2:B10")
      required:
        - description

    StyleHint:
      type: object
      properties:
        target:
          type: string
          description: What the style applies to (e.g., "cell", "text", "background")
        color:
          type: ["string", "null"]
          description: Color value (e.g., "red", "#FF0000", "green")
        bold:
          type: ["boolean", "null"]
        italic:
          type: ["boolean", "null"]
        condition:
          type: ["string", "null"]
          description: The condition that triggers this style (e.g., "value < 50")
      required:
        - target

    SmartAnalyzeResult:
      type: object
      properties:
        formula:
          type: string
          description: The generated Excel formula
        result:
          type: ["string", "null"]
          description: The computed result value (as string to support text results like "Pass"/"Fail")
        reasoning:
          type: string
          description: Explanation of how the formula was constructed (bilingual)
        formulaType:
          type: string
          description: Category of formula (e.g., "conditional", "arithmetic", "lookup", "formatting")
        styleHints:
          type: array
          items:
            $ref: "#/components/schemas/StyleHint"
          description: Visual formatting instructions implied by the description
        confidence:
          type: number
          description: AI confidence score 0-1
      required:
        - formula
        - result
        - reasoning
        - formulaType
        - styleHints
        - confidence

    SmartHistoryItem:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        formula:
          type: string
        result:
          type: ["string", "null"]
        reasoning:
          type: string
        formulaType:
          type: string
        styleHints:
          type: array
          items:
            $ref: "#/components/schemas/StyleHint"
        confidence:
          type: number
        analyzedAt:
          type: string
          format: date-time
      required:
        - id
        - description
        - formula
        - result
        - reasoning
        - formulaType
        - styleHints
        - confidence
        - analyzedAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
